name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  # Pull the latest upstream OpenCode release even when this repository is unchanged.
  schedule:
    - cron: "20 7 * * *"

permissions:
  contents: read

jobs:
  test:
    name: Unit and OpenCode release E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - name: Install plugin dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck and unit tests
        run: bun run check
      - name: Install latest released OpenCode
        run: npm install --global --no-audit --no-fund @opencode/cli@latest
      - name: Real OpenCode local-plugin mTLS Responses E2E
        run: |
          opencode --version
          bun run test:e2e
      - name: Pack plugin for installation-path test
        run: |
          filename="$(npm pack --silent --pack-destination "$RUNNER_TEMP")"
          echo "OPENCODE_E2E_PLUGIN_PACKAGE=opencode-mtls@file:${RUNNER_TEMP}/${filename}" >> "$GITHUB_ENV"
      - name: Real OpenCode installed-plugin mTLS Responses E2E
        run: bun run test:e2e
